name: CI


on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  test-and-vuln:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@v7.0.0 # v7.0.0
        with:
          go-version-file: go.mod
          cache: 'true'

      - name: Setup Node
        uses: actions/setup-node@v7.0.0 # v7.0.0
        with:
          node-version: '22'

      - name: Install markdown quality tools
        run: |
          npm install --global markdownlint-cli write-good
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://github.com/lycheeverse/lychee/releases/download/lychee-v0.23.0/lychee-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Check comment style
        run: bash ./scripts/check_comment_style.sh

      - name: Check markdown quality
        run: bash ./scripts/check_markdown_quality.sh

      - name: Run tests
        run: go test ./...

      - name: Run vulnerability scan
        run: |
          BIN="$(go env GOBIN)"
          if [ -z "$BIN" ]; then BIN="$(go env GOPATH)/bin"; fi
          "$BIN/govulncheck" ./...
